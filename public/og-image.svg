<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Graphite Paper background -->
  <rect width="1200" height="630" fill="#F4F3F0"/>

  <!-- Subtle grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(44,44,44,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Signal Copper accent rule -->
  <rect x="80" y="240" width="48" height="1" fill="#C8652A"/>

  <!-- Wordmark — MESHLY -->
  <text
    x="80"
    y="320"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="72"
    font-weight="300"
    letter-spacing="-0.03em"
    fill="#2C2C2C"
  >MESHLY</text>

  <!-- Domain -->
  <text
    x="80"
    y="372"
    font-family="'Courier New', monospace"
    font-size="18"
    letter-spacing="0.08em"
    fill="#8C8C8C"
  >meshly.pl</text>

  <!-- Tagline -->
  <text
    x="80"
    y="420"
    font-family="Georgia, serif"
    font-size="20"
    fill="#8C8C8C"
  >Web design and development studio — Warsaw, Poland</text>

  <!-- Mesh node (top right) -->
  <line x1="1100" y1="315" x2="1100" y2="252" stroke="#C8652A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="1100" y1="315" x2="1100" y2="378" stroke="#C8652A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="1100" y1="315" x2="1037" y2="315" stroke="#C8652A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="1100" y1="315" x2="1163" y2="315" stroke="#C8652A" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="1100" cy="315" r="7" fill="#C8652A"/>
</svg>
