<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <!-- Blueprint Night background -->
  <rect width="180" height="180" fill="#1C1F2A" rx="36"/>
  <!-- Connecting lines -->
  <line x1="90" y1="90" x2="90" y2="36" stroke="#C8652A" stroke-width="3" stroke-linecap="round"/>
  <line x1="90" y1="90" x2="90" y2="144" stroke="#C8652A" stroke-width="3" stroke-linecap="round"/>
  <line x1="90" y1="90" x2="36" y2="90" stroke="#C8652A" stroke-width="3" stroke-linecap="round"/>
  <line x1="90" y1="90" x2="144" y2="90" stroke="#C8652A" stroke-width="3" stroke-linecap="round"/>
  <!-- Center node -->
  <circle cx="90" cy="90" r="18" fill="#C8652A"/>
</svg>
